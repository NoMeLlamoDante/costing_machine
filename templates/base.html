{% load static %}
<!DOCTYPE html>
<html lang="es">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>cashing machine - {% block title %}{% endblock title %}</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@100..900&display=swap"
            rel="stylesheet">
        <link href="{% static 'css/styles.css' %}" rel="stylesheet" />
    </head>

    <body>
        <div class="container">
            {% include "navbar.html" %}
            {% block content %}{% endblock content %}
            {% include "footer.html" %}
        </div>
        <script src="https://kit.fontawesome.com/bcd9cbdfe0.js" crossorigin="anonymous"></script>
        <script src="{% static 'js/scripts.js' %}"></script>
    </body>

</html>
